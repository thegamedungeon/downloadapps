<head>
    <script>
        // This part runs BEFORE the page even finishes loading
        const urlParams = new URLSearchParams(window.location.search);
        const appId = urlParams.get('appid');

        if (appId) {
            document.write('<meta name="apple-itunes-app" content="app-id=' + appId + '">');
        }
    </script>
</head>

<body>
    <div style="background: #111; color: #0f0; padding: 20px; border: 2px solid #0f0; font-family: monospace;">
        <h3>-- THE CRIB: BANNER GEN --</h3>
        <input type="number" id="idInput" placeholder="Enter App ID">
        <button onclick="launch()">GENERATE & RELOAD</button>
    </div>

    <script>
        function launch() {
            let id = document.getElementById('idInput').value;
            if (id) {
                // This reloads the page with the ID in the URL
                window.location.href = window.location.pathname + "?appid=" + id;
            }
        }
    </script>
</body>
